<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PantryPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4 max-w-xl mx-auto">
  <h1 class="text-2xl font-bold">PantryPulse</h1>
  <p class="text-sm text-gray-500 mb-4">Expiry dates are estimates. If in doubt, throw it out.</p>

  <label class="block mb-4">
    <span class="px-4 py-2 bg-green-600 text-white rounded cursor-pointer inline-block">Scan receipt</span>
    <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
  </label>
  <p id="status" class="text-sm text-gray-500 mb-2"></p>

  <div id="list" class="space-y-3"></div>

  <button id="cook" class="px-4 py-2 bg-green-700 text-white rounded my-4">What should I cook?</button>
  <p id="cook-status" class="text-sm text-gray-500 mb-2"></p>
  <div id="recipes" class="space-y-3"></div>

  <script>
    let items = [];

    const colors = {
      RED: "bg-red-100 text-red-800",
      AMBER: "bg-amber-100 text-amber-800",
      GREEN: "bg-green-100 text-green-800"
    };

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    function render(list) {
        const sorted = [...list].sort((a, b) => a.daysLeft - b.daysLeft);
        document.getElementById("list").innerHTML = sorted.map(i => `
        <div class="bg-white rounded-xl p-4 shadow">
            <div class="flex justify-between items-center">
                <span class="font-semibold">${escapeHtml(i.name)}</span>
                <span class="text-sm px-2 py-1 rounded-full ${colors[i.color] ?? colors.AMBER}">
                    ${i.daysLeft < 0 ? "Expired" : i.daysLeft + " days left"}
                    </span>
                    </div>
                    <p class="text-sm text-gray-500">
                        Store: ${escapeHtml(i.storage)} · Use by ${escapeHtml(i.expiryDate)}
                    </p>
                    <p class="text-sm mt-1">${escapeHtml(i.tip)}</p>
                    ${i.needsReview
                        ? '<p class="text-xs text-amber-700 mt-1">Estimate. Please check.</p>'
                        : ""}
                </div>
            `).join("");
        }


    document.getElementById("cook").onclick = async () => {
  document.getElementById("cook-status").textContent = "Cooking up ideas...";
  try {
    const res = await fetch("/api/recipes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(items.map(i => ({ name: i.name, daysLeft: i.daysLeft })))
    });
    if (!res.ok) throw new Error("Server error " + res.status);
    const recipes = await res.json();
    document.getElementById("recipes").innerHTML = recipes.map(r => `
  <div class="bg-white rounded-xl p-4 shadow">
    <p class="font-semibold">
      ${escapeHtml(r.title)}
      <span class="text-sm text-gray-500">
        · ${escapeHtml(r.time)}
      </span>
    </p>
    <p class="text-sm text-green-700">
      Uses: ${r.usedExpiringItems.map(escapeHtml).join(", ")}
    </p>
    <p class="text-sm mt-1">
      ${r.ingredients.map(escapeHtml).join(", ")}
    </p>
    <ol class="list-decimal ml-5 text-sm mt-1">
      ${r.steps.map(s => `<li>${escapeHtml(s)}</li>`).join("")}
    </ol>
  </div>
`).join("");
    document.getElementById("cook-status").textContent = "";
  } catch (err) {
    document.getElementById("cook-status").textContent = "Could not get recipes: " + err.message;
  }
};

    async function loadSample() {
  try {
    const res = await fetch("/api/pantry/sample");
    if (!res.ok) throw new Error("Server error " + res.status);

    items = await res.json();
    render(items);
  } catch (err) {
    document.getElementById("status").textContent =
      "Could not load pantry: " + err.message;
  }
}

    document.getElementById("file").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById("status").textContent = "Reading receipt...";
      const form = new FormData();
      form.append("image", file);
      try {
        const res = await fetch("/api/receipt", { method: "POST", body: form });
        if (!res.ok) throw new Error("Server error " + res.status);
        items = items.concat(await res.json()); 
        render(items);
        document.getElementById("status").textContent = "";
      } catch (err) {
        document.getElementById("status").textContent = "Could not read the receipt: " + err.message;
      }
    };

    loadSample();
  </script>
</body>
</html>
