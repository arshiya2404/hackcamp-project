<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PantryPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --mint: #f1faf4;
        --sage: #608e6c;
        --light-green: #d5e5c5;
        --ink: #273c30;
        --muted: #66796a;
        --border: #dce8dc;
      }

      body {
        margin: 0;
        background: var(--mint);
        color: var(--ink);
        font-family: Arial, sans-serif;
        line-height: 1.6;
      }

      .page {
        max-width: 1060px;
        margin: auto;
        padding: 28px 24px 60px;
      }

      h1,
      h2,
      h3 {
        font-family: Georgia, serif;
        font-weight: normal;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        background: var(--sage);
        color: white;
        border: none;
        border-radius: 9px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
      }

      .button:hover {
        filter: brightness(0.95);
      }

      .button:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .button-secondary {
        background: var(--light-green);
        color: var(--ink);
      }

      .status {
        color: var(--muted);
        font-size: 13px;
        margin: 12px 0;
      }

      .status:empty {
        display: none;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding-bottom: 18px;
      }

      .brand {
        font: 26px Georgia, serif;
        text-decoration: none;
      }

      .brand span {
        color: var(--sage);
      }

      .tagline,
      .eyebrow {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .intro {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 24px;
        padding: 40px 0 30px;
      }

      .intro h1 {
        font-size: 46px;
        line-height: 1.1;
        margin: 10px 0 14px;
      }

      .intro-description {
        max-width: 420px;
        color: var(--muted);
      }

      .scan-button {
        white-space: nowrap;
      }

      .scan-button:focus-within {
        outline: 3px solid var(--sage);
        outline-offset: 4px;
      }

      @media (max-width: 700px) {
        .intro {
          flex-direction: column;
          align-items: stretch;
        }

        .intro h1 {
          font-size: 38px;
        }

        .tagline {
          font-size: 9px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="top-bar">
        <a class="brand" href="#">Pantry<span>Pulse</span></a>
        <span class="tagline">A little less waste</span>
      </header>

      <section class="intro">
        <div>
          <p class="eyebrow">Good food. Put to good use.</p>
          <h1>A fresh look<br />inside your fridge.</h1>
          <p class="intro-description">
            Keep track of what you have, use what’s next, and find something
            lovely to cook.
          </p>
        </div>

        <label class="button button-secondary scan-button">
          ＋ Scan a receipt
          <input
            id="file"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            capture="environment"
            class="hidden"
          />
        </label>
      </section>

      <p id="status" class="status" role="status"></p>
      <div id="list" class="space-y-3"></div>

      <button id="cook" class="px-4 py-2 bg-green-700 text-white rounded my-4">
        What should I cook?
      </button>
      <p id="cook-status" class="text-sm text-gray-500 mb-2"></p>
      <div id="recipes" class="space-y-3"></div>

      <script>
        let items = [];

        const colors = {
          RED: "bg-red-100 text-red-800",
          AMBER: "bg-amber-100 text-amber-800",
          GREEN: "bg-green-100 text-green-800",
        };

        function escapeHtml(value) {
          return String(value ?? "").replace(
            /[&<>"']/g,
            (character) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              }[character])
          );
        }

        function render(list) {
          const sorted = [...list].sort((a, b) => a.daysLeft - b.daysLeft);
          document.getElementById("list").innerHTML = sorted
            .map(
              (i) => `
        <div class="bg-white rounded-xl p-4 shadow">
            <div class="flex justify-between items-center">
                <span class="font-semibold">${escapeHtml(i.name)}</span>
                <span class="text-sm px-2 py-1 rounded-full ${
                  colors[i.color] ?? colors.AMBER
                }">
                    ${i.daysLeft < 0 ? "Expired" : i.daysLeft + " days left"}
                    </span>
                    </div>
                    <p class="text-sm text-gray-500">
                        Store: ${escapeHtml(i.storage)} · Use by ${escapeHtml(
                i.expiryDate
              )}
                    </p>
                    <p class="text-sm mt-1">${escapeHtml(i.tip)}</p>
                    ${
                      i.needsReview
                        ? '<p class="text-xs text-amber-700 mt-1">Estimate. Please check.</p>'
                        : ""
                    }
                </div>
            `
            )
            .join("");
        }

        document.getElementById("cook").onclick = async () => {
          document.getElementById("cook-status").textContent =
            "Cooking up ideas...";
          try {
            const res = await fetch("/api/recipes", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(
                items.map((i) => ({ name: i.name, daysLeft: i.daysLeft }))
              ),
            });
            if (!res.ok) throw new Error("Server error " + res.status);
            const recipes = await res.json();
            document.getElementById("recipes").innerHTML = recipes
              .map(
                (r) => `
    <div class="bg-white rounded-xl p-4 shadow">
        <p class="font-semibold">
        ${escapeHtml(r.title)}
        <span class="text-sm text-gray-500">
            · ${escapeHtml(r.time)}
        </span>
        </p>
        <p class="text-sm text-green-700">
        Uses: ${r.usedExpiringItems.map(escapeHtml).join(", ")}
        </p>
        <p class="text-sm mt-1">
        ${r.ingredients.map(escapeHtml).join(", ")}
        </p>
        <ol class="list-decimal ml-5 text-sm mt-1">
        ${r.steps.map((s) => `<li>${escapeHtml(s)}</li>`).join("")}
        </ol>
    </div>
`
              )
              .join("");
            document.getElementById("cook-status").textContent = "";
          } catch (err) {
            document.getElementById("cook-status").textContent =
              "Could not get recipes: " + err.message;
          }
        };

        async function loadSample() {
          try {
            const res = await fetch("/api/pantry/sample");
            if (!res.ok) throw new Error("Server error " + res.status);

            items = await res.json();
            render(items);
          } catch (err) {
            document.getElementById("status").textContent =
              "Could not load pantry: " + err.message;
          }
        }

        document.getElementById("file").onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          document.getElementById("status").textContent = "Reading receipt...";
          const form = new FormData();
          form.append("image", file);
          try {
            const res = await fetch("/api/receipt", {
              method: "POST",
              body: form,
            });
            if (!res.ok) throw new Error("Server error " + res.status);
            items = items.concat(await res.json());
            render(items);
            document.getElementById("status").textContent = "";
          } catch (err) {
            document.getElementById("status").textContent =
              "Could not read the receipt: " + err.message;
          }
        };

        loadSample();
      </script>
    </main>
  </body>
</html>
